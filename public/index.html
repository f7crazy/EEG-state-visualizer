<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEG State Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Import Three.js via ES Modules -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <!-- The WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- The UI Overlay / Simulator Controls -->
    <div id="ui-panel">
        <h1>Neurological State Matrix</h1>
        <div class="state-indicator">Current State: <span id="dominant-state" style="color: #00ffcc;">Calm (Alpha)</span></div>

        <div class="controls">
            <div class="slider-group">
                <label>Delta (Deep Sleep) <span id="val-delta">20</span>%</label>
                <input type="range" id="slider-delta" min="0" max="100" value="20">
            </div>
            <div class="slider-group">
                <label>Theta (REM/Meditation) <span id="val-theta">30</span>%</label>
                <input type="range" id="slider-theta" min="0" max="100" value="30">
            </div>
            <div class="slider-group">
                <label>Alpha (Relaxed) <span id="val-alpha">60</span>%</label>
                <input type="range" id="slider-alpha" min="0" max="100" value="60">
            </div>
            <div class="slider-group">
                <label>Beta (Active/Alert) <span id="val-beta">10</span>%</label>
                <input type="range" id="slider-beta" min="0" max="100" value="10">
            </div>
        </div>
        
        <p class="hint">Adjust the sliders to simulate changing brainwave frequencies. The particle system will adapt its speed, turbulence, and color to match the dominant state.</p>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
